<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回声-9 · 记录未中断</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="crt"></div>

<header id="topbar">
  <div class="brand">ECHO-9 <span class="dim">/ 值班终端</span></div>
  <div class="goal">目标：<span id="goalText">离开值班室</span></div>
  <div class="tools">
    <button id="btnBook" class="tbtn">结论簿</button>
    <button id="btnCfg" class="tbtn">设置</button>
    <span id="modeTag" class="tag offline">离线</span>
  </div>
</header>

<main id="main">

  <section id="stage">
    <svg id="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#161a19"/>
          <stop offset="100%" stop-color="#0c0f0e"/>
        </linearGradient>
        <linearGradient id="glowG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="rgba(224,164,74,.18)"/>
          <stop offset="100%" stop-color="rgba(224,164,74,0)"/>
        </linearGradient>
      </defs>

      <!-- 墙/地 -->
      <rect x="0" y="0" width="800" height="410" fill="url(#wallG)"/>
      <rect x="0" y="410" width="800" height="90" fill="#070908"/>
      <line x1="0" y1="410" x2="800" y2="410" class="edge"/>
      <rect id="ceilGlow" x="0" y="0" width="800" height="180" fill="url(#glowG)"/>

      <!-- 窗 -->
      <g class="obj" data-id="window">
        <rect x="62" y="88" width="140" height="112" class="fill-dk"/>
        <rect x="70" y="96" width="124" height="96" fill="#1b201f"/>
        <g id="snow"></g>
        <line x1="132" y1="96" x2="132" y2="192" class="edge"/>
        <line x1="70" y1="144" x2="194" y2="144" class="edge"/>
      </g>

      <!-- 暖气片 -->
      <g class="obj" data-id="radiator">
        <rect x="62" y="330" width="122" height="66" class="fill-dk"/>
        <g class="edge-g">
          <line x1="80"  y1="336" x2="80"  y2="390"/><line x1="98"  y1="336" x2="98"  y2="390"/>
          <line x1="116" y1="336" x2="116" y2="390"/><line x1="134" y1="336" x2="134" y2="390"/>
          <line x1="152" y1="336" x2="152" y2="390"/><line x1="170" y1="336" x2="170" y2="390"/>
        </g>
        <g id="heatWave" class="heat">
          <path d="M80 322 q6 -10 12 0 q6 10 12 0" /><path d="M124 318 q6 -10 12 0 q6 10 12 0" />
        </g>
      </g>

      <!-- 椅子 + 大衣 -->
      <g class="obj" data-id="coat">
        <rect x="248" y="316" width="76" height="10" class="fill-dk"/>
        <line x1="252" y1="326" x2="252" y2="404" class="edge"/>
        <line x1="318" y1="326" x2="318" y2="404" class="edge"/>
        <rect x="246" y="238" width="12" height="80" class="fill-dk"/>
        <path d="M246 244 q34 -22 68 -2 l6 74 q-40 14 -80 0 z" class="fill-md"/>
        <rect x="292" y="262" width="16" height="9" class="fill-hi"/>
      </g>

      <!-- 桌子 -->
      <rect x="356" y="320" width="248" height="9" class="fill-dk"/>
      <line x1="368" y1="329" x2="368" y2="410" class="edge"/>
      <line x1="592" y1="329" x2="592" y2="410" class="edge"/>

      <!-- 日志本 -->
      <g class="obj" data-id="logbook">
        <path d="M424 320 l44 -14 l44 14 z" class="fill-md"/>
        <path d="M424 320 l44 -14" class="edge-s"/>
        <line x1="468" y1="306" x2="468" y2="320" class="edge-s"/>
      </g>

      <!-- 监控屏 -->
      <g class="obj" data-id="monitor">
        <rect x="388" y="108" width="116" height="94" class="fill-dk"/>
        <rect x="396" y="116" width="100" height="70" id="screenBg" fill="#12211c"/>
        <g id="screenArt">
          <line x1="404" y1="180" x2="440" y2="132" class="scr"/>
          <line x1="488" y1="180" x2="452" y2="132" class="scr"/>
          <line x1="440" y1="132" x2="452" y2="132" class="scr"/>
        </g>
        <text id="screenTime" x="490" y="182" class="scrtxt" text-anchor="end">04:17</text>
        <rect x="428" y="202" width="36" height="6" class="fill-dk"/>
      </g>

      <!-- 配电箱 -->
      <g class="obj" data-id="breaker">
        <rect x="556" y="116" width="86" height="98" class="fill-dk"/>
        <rect x="564" y="124" width="70" height="82" fill="#101413"/>
        <g id="switches"></g>
      </g>

      <!-- 门 -->
      <g class="obj" data-id="door">
        <rect x="676" y="138" width="106" height="272" class="fill-md"/>
        <line x1="676" y1="138" x2="676" y2="410" class="edge"/>
        <rect x="684" y="146" width="90" height="256" fill="#0e1211"/>
        <rect x="750" y="262" width="8" height="26" class="fill-hi"/>
        <circle id="doorLed" cx="700" cy="250" r="5" class="led-red"/>
        <rect id="doorOpenFx" x="684" y="146" width="90" height="256" fill="#e0a44a" opacity="0"/>
      </g>

      <!-- 热区 -->
      <g id="hotspots"></g>
    </svg>

    <div id="thinking" class="hidden"><span class="dot"></span><span class="dot"></span><span class="dot"></span> 它在考虑要不要回应</div>
  </section>

  <aside id="side">
    <div id="objHead">
      <div id="objName">值班室</div>
      <div id="objVerbs"></div>
    </div>
    <div id="feed"></div>
  </aside>
</main>

<footer id="clues">
  <div class="cluesLabel">线索</div>
  <div id="clueList"><span class="empty">还没有发现任何东西。点击场景里的物体开始。</span></div>
  <div id="handHint" class="hidden"></div>
</footer>

<!-- 结论簿 -->
<div id="bookModal" class="modal hidden">
  <div class="modalBox">
    <div class="modalTitle">结论簿 <span class="dim">/ 三条正确即可确认</span></div>
    <div id="bookBody"></div>
    <div class="modalFoot">
      <span id="bookStatus" class="dim"></span>
      <button class="tbtn" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div id="cfgModal" class="modal hidden">
  <div class="modalBox">
    <div class="modalTitle">设置</div>
    <div class="cfgRow">
      <label>Anthropic API Key</label>
      <input id="apiKey" type="password" placeholder="sk-ant-... （留空则运行离线模式）">
    </div>
    <div class="cfgRow">
      <label>模型</label>
      <input id="apiModel" type="text" value="claude-sonnet-5">
    </div>
    <p class="note">仅存在本机 localStorage。离线模式下自由交互与遭遇使用内置回应，游戏依然可以完整通关。</p>
    <div class="modalFoot">
      <button class="tbtn" id="cfgSave">保存</button>
      <button class="tbtn" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- 结算 -->
<div id="endModal" class="modal hidden">
  <div class="modalBox wide">
    <div class="modalTitle">它的内心独白</div>
    <div id="endBody"></div>
    <div class="modalFoot"><button class="tbtn" data-close>关闭</button></div>
  </div>
</div>

<script src="data.js"></script>
<script src="llm.js"></script>
<script src="game.js"></script>
</body>
</html>
