<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>不能说 · 它有自己的想法</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="crt"></div>

<header id="topbar">
  <div class="brand">不能说 <span class="dim">/ <span id="placeName">未连接</span></span></div>
  <div id="trust" class="hidden">
    <span class="tlabel">它对你</span>
    <span class="tbar"><i id="trustFill"></i></span>
    <span id="trustNote" class="tnote">提防着你</span>
  </div>
  <div class="tools">
    <button id="btnSheet" class="tbtn">本子</button>
    <button id="btnShow" class="tbtn hl">摊牌</button>
    <button id="btnNew" class="tbtn">重开一局</button>
    <button id="btnCfg" class="tbtn">设置</button>
    <span id="modeTag" class="tag offline">未接入</span>
  </div>
</header>

<main id="main">
  <section id="stage">
    <svg id="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="boot" class="hidden"></div>
    <div id="thinking" class="hidden"></div>
    <div id="itMoving" class="hidden">它在动</div>
  </section>

  <aside id="side">
    <div id="feed"></div>
  </aside>
</main>

<footer id="bottom">
  <div id="askRow">
    <span class="fl">问谁</span>
    <input id="who" type="text" autocomplete="off" spellcheck="false"
           placeholder="留空＝问它自己　可以写好几个，一个算一次" disabled>
    <span class="fl">问什么</span>
    <input id="cmd" type="text" autocomplete="off" spellcheck="false"
           placeholder="一句话——问句、说法、猜测都行" disabled>
    <button id="send" class="tbtn hl">问</button>
  </div>
  <div id="castRow"></div>
</footer>

<!-- 本子：汤面 + 证人席 + 问过的每一句 -->
<div id="sheetModal" class="modal hidden">
  <div class="modalBox sheet">
    <div class="modalTitle">本子　<span class="dim">Tab 开关</span></div>
    <div id="sheetHook" class="reveal"></div>
    <div id="sheetCast"></div>
    <div id="sheetWho"></div>
    <div id="sheetBoard"></div>
    <div class="modalFoot">
      <span class="note dim">点上面的名字＝只看它说过的话。它们互相不合，谁都可能骗你。</span>
      <button class="tbtn" data-close>合上</button>
    </div>
  </div>
</div>

<!-- 摊牌：一次答完，一次判完 -->
<div id="showModal" class="modal hidden">
  <div class="modalBox">
    <div class="modalTitle">摊牌</div>
    <p class="note">这几道题的答案，它在开局之前就写好封存了。<br>
      <b>全部答对才算过。</b>不会告诉你对了几道，只给一句它听完之后的反应。</p>
    <div id="showList"></div>
    <p class="note dim">没全对不结束这一局，但摊一次牌要花掉你三次提问的额度——
      它会因此往前挪一步。你填的答案留着，下次直接改。</p>
    <div class="modalFoot">
      <button class="tbtn hl" id="showGo">说完了</button>
      <span style="display:flex;gap:8px">
        <button class="tbtn" data-close>再想想</button>
        <button class="tbtn" id="giveUp">放弃，揭晓</button>
      </span>
    </div>
  </div>
</div>

<!-- 设置 -->
<div id="cfgModal" class="modal hidden">
  <div class="modalBox">
    <div class="modalTitle">设置</div>
    <div class="cfgRow">
      <label>DeepSeek API Key</label>
      <input id="apiKey" type="password" placeholder="sk-...">
    </div>
    <div class="cfgRow">
      <label>开局／问答／摊牌模型　<span class="dim">要算账，得用好的</span></label>
      <input id="apiModelGen" type="text" placeholder="deepseek-v4-pro">
    </div>
    <div class="cfgRow">
      <label>它自己动（旁白）模型　<span class="dim">只写它怎么哑的，快就行</span></label>
      <input id="apiModelPlay" type="text" placeholder="deepseek-v4-flash">
    </div>
    <div class="cfgRow">
      <label>接口地址</label>
      <input id="apiEndpoint" type="text" placeholder="https://api.deepseek.com/chat/completions">
    </div>
    <p class="note">仅存在本机 localStorage。<br>
      这是一款 AI 原生游戏：汤面、证人、它想要的东西、以及整幅画面，都是它在开局时自己想出来的。没有模型就没有游戏。</p>
    <div class="modalFoot">
      <button class="tbtn" id="cfgSave">保存并重开</button>
      <button class="tbtn" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- 揭晓 -->
<div id="endModal" class="modal hidden">
  <div class="modalBox wide">
    <div class="modalTitle" id="endTitle">揭晓</div>
    <div id="endBody"></div>
    <div class="modalFoot">
      <button class="tbtn hl" id="endAgain">再来一局</button>
      <button class="tbtn" data-close>关闭</button>
    </div>
  </div>
</div>

<script src="key.local.js" onerror="window.E9_LOCAL_KEY=''"></script>
<script src="data.js"></script>
<script src="render.js"></script>
<script src="llm.js"></script>
<script src="game.js"></script>
</body>
</html>
