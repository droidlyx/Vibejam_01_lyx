<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>它有自己的想法</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="crt"></div>

<header id="topbar">
  <div class="brand">ECHO <span class="dim">/ <span id="placeName">未连接</span></span></div>
  <div class="tools">
    <button id="btnGuess" class="tbtn hl">说出你的判断</button>
    <button id="btnNew" class="tbtn">重开一局</button>
    <button id="btnCfg" class="tbtn">设置</button>
    <span id="modeTag" class="tag offline">未接入</span>
  </div>
</header>

<main id="main">
  <section id="stage">
    <svg id="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="boot" class="hidden"></div>
    <div id="thinking" class="hidden"></div>
  </section>

  <aside id="side">
    <div id="objHead">
      <div id="objName">—</div>
      <div id="objSub">点击画面里的东西＝观察，不花时间。想做什么，在下面打出来。</div>
    </div>
    <div id="feed"></div>
  </aside>
</main>

<footer id="bottom">
  <div id="inputRow">
    <span id="focusTag" class="hidden"></span>
    <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="你想做什么？" disabled>
    <button id="send" class="tbtn">执行</button>
  </div>
  <div id="clueRow">
    <span class="cluesLabel">它做过的</span>
    <div id="clueList"><span class="empty">—</span></div>
  </div>
</footer>

<!-- 说出判断 -->
<div id="guessModal" class="modal hidden">
  <div class="modalBox">
    <div class="modalTitle">说出你的判断</div>
    <p class="note" id="guessQ">它想从你这里得到什么？</p>
    <div class="cfgRow">
      <input id="guessInput" type="text" placeholder="用一句话说出来">
    </div>
    <p class="note dim">它在这一局开始之前就把答案写下来了，代码封存着。<br>
      猜错不会结束这一局——它会作出反应，你可以接着找。<br>
      但它会把注意力收回去：<b>每猜错一次，下一次开口的代价就更高</b>，
      你得先在这里做够相应次数的事，它才会再听你说话。</p>
    <div class="modalFoot">
      <button class="tbtn hl" id="guessGo">说出来</button>
      <span style="display:flex;gap:8px">
        <button class="tbtn" data-close>再想想</button>
        <button class="tbtn" id="giveUp">放弃，揭晓</button>
      </span>
    </div>
  </div>
</div>

<!-- 设置 -->
<div id="cfgModal" class="modal hidden">
  <div class="modalBox">
    <div class="modalTitle">设置</div>
    <div class="cfgRow">
      <label>DeepSeek API Key</label>
      <input id="apiKey" type="password" placeholder="sk-...">
    </div>
    <div class="cfgRow">
      <label>模型</label>
      <input id="apiModel" type="text" placeholder="deepseek-v4-flash">
    </div>
    <div class="cfgRow">
      <label>接口地址</label>
      <input id="apiEndpoint" type="text" placeholder="https://api.deepseek.com/chat/completions">
    </div>
    <p class="note">仅存在本机 localStorage。<br>
      这是一款 AI 原生游戏：地点、往事、它想要的东西、以及整个画面，都是它在开局时自己想出来的。没有模型就没有游戏。</p>
    <div class="modalFoot">
      <button class="tbtn" id="cfgSave">保存并重开</button>
      <button class="tbtn" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- 结算 -->
<div id="endModal" class="modal hidden">
  <div class="modalBox wide">
    <div class="modalTitle" id="endTitle">结算</div>
    <div id="endBody"></div>
    <div class="modalFoot">
      <button class="tbtn hl" id="endAgain">再来一局</button>
      <button class="tbtn" data-close>关闭</button>
    </div>
  </div>
</div>

<script src="key.local.js" onerror="window.E9_LOCAL_KEY=''"></script>
<script src="data.js"></script>
<script src="render.js"></script>
<script src="llm.js"></script>
<script src="game.js"></script>
</body>
</html>
